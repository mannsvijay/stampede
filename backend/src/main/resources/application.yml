spring:
  application:
    name: stampede
  config:
    # Load the repo-root .env (shared with docker-compose) as a properties file.
    # "optional:" means startup doesn't fail when it's missing (e.g. in tests or CI).
    import: optional:file:../.env[.properties]
  datasource:
    # POSTGRES_HOST and REDIS_HOST are unset for host runs (bootRun), so localhost is used.
    # docker-compose sets them to the service names, with the internal ports (D-013).
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:stampede}
    username: ${POSTGRES_USER:stampede}
    password: ${POSTGRES_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # Fail fast instead of Lettuce's 60 s default, so health turns DOWN quickly when Redis is gone.
      timeout: 2s
      connect-timeout: 2s

server:
  error:
    # Our ProblemErrorController replaces Boot's default /error handler and never reads these, but if
    # the default ever came back, it must not leak internals either.
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

springdoc:
  api-docs:
    # Off by default: the spec endpoint is not public. The `openapi` profile turns it on (below).
    enabled: false
  # Our controllers only produce JSON; without this, success responses are documented as */*.
  default-produces-media-type: application/json
  # Stable output for the committed docs/openapi.json (D-010).
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true
  # Don't attach every @ExceptionHandler's response to every operation; OpenApiConfig documents
  # errors explicitly from @ErrorResponses.
  override-with-generic-response: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # Local development only: shows the db and redis components individually.
      # Restrict this before deploying (M7).
      show-details: always

stampede:
  auth:
    # Base64 of at least 32 random bytes (HS256). No default: the app refuses to start without it.
    # Generate one with: openssl rand -base64 32
    jwt-secret: ${STAMPEDE_JWT_SECRET:}
    issuer: stampede
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    refresh-family-max-age: 30d
  tickets:
    # Ed25519 private key for signing tickets (D-018): base64 of exactly 32 random bytes (the seed).
    # No default: the app refuses to start without a valid one. Generate: docs/DEVELOPING.md.
    signing-key: ${STAMPEDE_TICKET_SIGNING_KEY:}
  holds:
    sweeper:
      # Expires holds past their time (D-016). Every instance sweeps; duplicates are harmless.
      enabled: true
      # Delay between the end of one sweep and the start of the next (ISO-8601 duration).
      interval: PT5S
      # Expired holds read per page; a sweep pages past holds it could not expire (D-016).
      batch-size: 500
  inventory:
    optimistic:
      # Retry policy of the optimistic strategy (D-021). Tries per hold, the first one included; a
      # taken (HELD/SOLD) seat is never retried, only a lost version check is.
      max-attempts: 3
      # Before try n the strategy sleeps a random time in [0, min(backoff-max, backoff-base * 2^(n-2))]
      # ("full jitter"), with no transaction or connection held.
      backoff-base: 5ms
      backoff-max: 50ms
  invariants:
    monitor:
      # Runs the invariant checker (PRD 6.10, D-019) over every event that is neither DRAFT nor ENDED;
      # logs violations at ERROR and sets the gauge stampede.invariants.violations{rule}.
      enabled: true
      # Delay between the end of one check and the start of the next (ISO-8601 duration).
      interval: PT30S
      # In-between states of a checkout (PENDING order, PAID without tickets yet, ...) are excused
      # while the order is younger than this. Must be positive; tests check strictly (zero).
      grace: PT30S
  # Read only under the bootstrap-admin profile (AdminBootstrapRunner).
  bootstrap-admin:
    email: ${STAMPEDE_ADMIN_EMAIL:}
    password: ${STAMPEDE_ADMIN_PASSWORD:}

---
# Serves the generated OpenAPI spec at /v3/api-docs. For local development and the drift test
# (OpenApiSpecTest); the committed docs/openapi.json is what the frontend consumes.
spring:
  config:
    activate:
      on-profile: openapi
springdoc:
  api-docs:
    enabled: true
