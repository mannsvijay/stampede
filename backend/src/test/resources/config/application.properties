# Test-only settings. Spring Boot loads classpath:/config/application.properties after
# classpath:/application.yml (and its ../.env import), so these values win over a developer's .env.

# Base64 of the 32 ASCII bytes "stampede-test-only-signing-key-0". Not a secret: it only ever
# signs tokens inside tests. JwtFilterTest asserts that tests really use this key.
stampede.auth.jwt-secret=c3RhbXBlZGUtdGVzdC1vbmx5LXNpZ25pbmcta2V5LTA=

# Base64 of the 32 ASCII bytes "stampede-test-only-ticket-key-00", the Ed25519 seed tests sign
# tickets with. Not a secret. TicketsApiTest asserts that tests really use this key.
stampede.tickets.signing-key=c3RhbXBlZGUtdGVzdC1vbmx5LXRpY2tldC1rZXktMDA=

# The scheduled invariant monitor (D-019) is off in tests: the after-test assertion checks strictly
# instead, and InvariantMonitorTest drives the monitor directly.
stampede.invariants.monitor.enabled=false

# The scheduled hold expiry sweeper (D-016) is off in tests too: no background expiry while tests set
# up holds, and no schedule left running in cached contexts. HoldExpirySweeperTest drives the sweeper
# directly.
stampede.holds.sweeper.enabled=false

# The Redis stream consumer thread and the reconciler schedule (D-022, M2.2b) are off in tests for the
# same reasons. The Redis persistence tests drive RedisStreamConsumer and RedisReconciler directly.
stampede.inventory.redis.consumer.enabled=false
stampede.inventory.redis.reconciler.enabled=false

# Every cached test context keeps a pool on the one shared test Postgres (TestDatabases). Hikari's
# default keeps all maximum-pool-size connections open forever; this lets an idle context's pool
# shrink to zero after 10 s, so 15 cached contexts don't hold ~180 connections. The concurrency
# harness bases set minimum-idle back to their pool size, so racing threads never wait for a new one.
spring.datasource.hikari.minimum-idle=0
# Milliseconds: Hikari's setter takes a long, not a Duration ("10s" fails to bind). 10 s is Hikari's minimum.
spring.datasource.hikari.idle-timeout=10000

# Redis command timeout for tests: 10 s instead of production's 2 s (application.yml). Long 1000-round
# runs on an overloaded Windows/Docker Desktop laptop hit 2 s RedisCommandTimeoutExceptions from
# client-side stalls (Docker's port forwarder, a starved JVM) while Redis SLOWLOG stayed empty; never
# on a correctness check. Correctness never depends on this value: the harness checks double-sells, the
# cap, I10 and the invariants either way. How long Redis itself blocks is measured server side
# (SLOWLOG) by RedisHoldStateReaderTest, which this timeout can't affect. The consumer's block time
# stays below it (1.9 s guard in RedisInventoryProperties). RedisTimeoutSettingsTest pins both values.
spring.data.redis.timeout=10s
