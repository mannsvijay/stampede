# Test-only settings. Spring Boot loads classpath:/config/application.properties after
# classpath:/application.yml (and its ../.env import), so these values win over a developer's .env.

# Base64 of the 32 ASCII bytes "stampede-test-only-signing-key-0". Not a secret: it only ever
# signs tokens inside tests. JwtFilterTest asserts that tests really use this key.
stampede.auth.jwt-secret=c3RhbXBlZGUtdGVzdC1vbmx5LXNpZ25pbmcta2V5LTA=

# Base64 of the 32 ASCII bytes "stampede-test-only-ticket-key-00", the Ed25519 seed tests sign
# tickets with. Not a secret. TicketsApiTest asserts that tests really use this key.
stampede.tickets.signing-key=c3RhbXBlZGUtdGVzdC1vbmx5LXRpY2tldC1rZXktMDA=

# The scheduled invariant monitor (D-019) is off in tests: the after-test assertion checks strictly
# instead, and InvariantMonitorTest drives the monitor directly.
stampede.invariants.monitor.enabled=false
