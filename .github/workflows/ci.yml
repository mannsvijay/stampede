# CI for Stampede (D-012). Three independent jobs: Backend (Gradle + Testcontainers), Frontend (npm)
# and Compose smoke (the backend image and docker-compose stack, D-013).
#
# Supply chain: every action is pinned to a full commit SHA (a tag can be moved, a SHA can't), with
# the release in a comment. Each release was at least 14 days old when pinned, the same rule as npm
# packages (D-011). To update one, look up the new tag's commit with
#   git ls-remote https://github.com/<owner>/<repo>.git "refs/tags/<tag>^{}"
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Adds a "Run workflow" button in the Actions tab, for manual runs.
  workflow_dispatch:

# Least privilege: the job token can read the repo and nothing else.
permissions:
  contents: read

# A new push to a PR branch cancels that branch's older, now-pointless run. Runs on main are never
# cancelled, so every commit on main gets its own green or red result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the job token in .git/config for later steps.
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      # Validates gradle-wrapper.jar against Gradle's published checksums, and caches ~/.gradle
      # (dependencies and the wrapper's Gradle distribution). Only main writes the cache; other
      # branches only read it, so a PR can't poison it.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true

      # github.com sometimes returns 504 for the Gradle distribution (SESSION_LOG, M0.1). After the
      # first green run on main it comes from the cache; on a cold cache, retry the download here so
      # a transient error doesn't fail the build in the middle of the tests. The wrapper checks the
      # download against distributionSha256Sum in gradle-wrapper.properties.
      - name: Download Gradle (retried)
        run: |
          for attempt in 1 2 3; do
            if ./gradlew --version; then
              exit 0
            fi
            echo "::warning::Gradle download failed (attempt $attempt of 3)"
            sleep $((attempt * 15))
          done
          echo "::error::Could not download Gradle after 3 attempts"
          exit 1

      # Includes the Testcontainers tests (Docker is preinstalled on the runner), the Modulith
      # verification test and OpenApiSpecTest (which reads ../docs/openapi.json).
      # The concurrency harness (M1.3) runs 100 rounds per scenario, the same as the local default;
      # the flag pins it here. The full proof is 1000 rounds, run locally on demand
      # (-Dstampede.harness.rounds=1000).
      - name: Test
        run: ./gradlew test -Dstampede.harness.rounds=100

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-reports
          path: |
            backend/build/reports/tests/test/
            backend/build/test-results/test/
          retention-days: 7

  # Proves the M0 exit criterion: on a fresh checkout, with .env made from .env.example, compose
  # builds the backend image, brings every service to healthy and serves the seeded demo event.
  # No extra actions: plain `docker compose build`, so no layer cache (a cold build each run).
  compose-smoke:
    name: Compose smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A throwaway .env from the template, with freshly generated secrets for this run only.
      # add-mask hides them if anything prints them.
      - name: Create .env
        run: |
          pg_password=$(openssl rand -hex 24)
          redis_password=$(openssl rand -hex 24)
          jwt_secret=$(openssl rand -base64 32)
          echo "::add-mask::$pg_password"
          echo "::add-mask::$redis_password"
          echo "::add-mask::$jwt_secret"
          cp .env.example .env
          sed -i \
            -e "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$pg_password|" \
            -e "s|^REDIS_PASSWORD=.*|REDIS_PASSWORD=$redis_password|" \
            -e "s|^STAMPEDE_JWT_SECRET=.*|STAMPEDE_JWT_SECRET=$jwt_secret|" \
            .env

      # The Gradle download inside the build is retried (backend/Dockerfile).
      - name: Build backend image
        run: docker compose build backend

      - name: Start the stack and wait for healthy
        run: docker compose up -d --wait --wait-timeout 240

      - name: GET /events returns the seeded demo event
        run: |
          curl -fsS http://localhost:8080/events | tee events.json
          echo
          jq -e '.items[] | select(.title == "Stampede Demo Drop" and .status == "SCHEDULED")' events.json

      - name: Backend runs as non-root
        run: |
          uid=$(docker compose exec -T backend id -u)
          echo "backend uid: $uid"
          test "$uid" != "0"
          image=$(docker inspect --format '{{.Config.Image}}' "$(docker compose ps -q backend)")
          test "$(docker image inspect "$image" --format '{{.Config.User}}')" = "stampede"

      # Searches the whole image filesystem (as root, so nothing is hidden by permissions) and the
      # jar's entries. Any match fails the job.
      - name: Image contains no .env
        run: |
          image=$(docker inspect --format '{{.Config.Image}}' "$(docker compose ps -q backend)")
          echo "image: $image"
          found=$(docker run --rm --user root --entrypoint find "$image" / -xdev -name '.env*')
          if [ -n "$found" ]; then echo "::error::.env files in the image: $found"; exit 1; fi
          cid=$(docker create "$image")
          docker cp "$cid:/app/app.jar" app.jar
          docker rm "$cid"
          if unzip -Z1 app.jar | grep -E '(^|/)\.env'; then echo "::error::.env in app.jar"; exit 1; fi
          echo "No .env in the image or the jar"

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop and remove the stack
        if: always()
        run: docker compose down -v

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Installs exactly the lockfile. --ignore-scripts stops dependencies' install scripts from
      # running, a common way for a compromised package to execute code.
      - name: Install
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Fails if src/api/schema.d.ts doesn't match the committed docs/openapi.json.
      - name: Generated client up to date
        run: npm run check:api

      - name: Build
        run: npm run build

      # Blocking: high or critical advisories in code that ships to users.
      - name: Audit (production, blocking)
        run: npm audit --omit=dev --audit-level=high

      # Report-only: everything, including dev tooling. A red step here shows as a warning on the
      # run, not a failure. Known and accepted: the minimatch advisory in lint tooling (D-011).
      - name: Audit (all, report only)
        continue-on-error: true
        run: npm audit
