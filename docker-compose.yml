# Stampede: local infrastructure plus the backend (D-013). Credentials come from .env (template:
# .env.example); a missing variable stops compose with an error naming it.
# Ports are bound to 127.0.0.1 so nothing is exposed to your network.
# The frontend runs on the host with `npm run dev` and proxies the API to localhost:8080.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      # $$ escapes $ so the variable is expanded inside the container, not by compose.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    # Durability for Redis-first holds (D-022): the append-only file is fsynced once a second, so a crash
    # loses at most about the last second of writes. noeviction: when a memory limit is reached, Redis
    # refuses writes instead of silently evicting hold keys (no maxmemory is set here, so no limit yet).
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}",
              "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    # Image name is <project>-backend (the project defaults to the folder name), so two clones
    # don't overwrite each other's image.
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # An explicit list, not env_file: .env's POSTGRES_PORT and REDIS_PORT are the ports on your
    # machine. Inside Docker the backend reaches the services by name on their own ports.
    # Secrets are passed in when the container starts; they are not in the image.
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      STAMPEDE_JWT_SECRET: ${STAMPEDE_JWT_SECRET:?set STAMPEDE_JWT_SECRET in .env}
      STAMPEDE_TICKET_SIGNING_KEY: ${STAMPEDE_TICKET_SIGNING_KEY:?set STAMPEDE_TICKET_SIGNING_KEY in .env}
      # seed: load the demo venue and event (idempotent). demo-reschedule: move the demo drop into
      # the future. Set STAMPEDE_COMPOSE_PROFILES in .env to change; set it empty for no seeding.
      SPRING_PROFILES_ACTIVE: ${STAMPEDE_COMPOSE_PROFILES-seed,demo-reschedule}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    healthcheck:
      # curl ships in the runtime image. -f fails on HTTP errors: health is 503 when DOWN.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      # Startup (JVM, Flyway, seeding) is not counted against the retries.
      start_period: 90s

volumes:
  pg-data:
  redis-data:
